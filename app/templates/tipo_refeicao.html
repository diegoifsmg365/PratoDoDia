<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tipos de Refeição</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-success">
        <a class="navbar-brand" href="/">Prato do Dia</a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link text-dark" href="/">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-dark" href="/cardapio-dia/">Cardápio do Dia</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-dark" href="/cardapio-semanal/">Cardápio Semanal</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-dark" href="/refeicoes/">Refeições</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-dark" href="/avaliacoes/">Avaliações</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-dark" href="/sugestoes/">Sugestões</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-dark" href="/avisos/">Avisos</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-dark" href="/admin/">Administração</a>
                </li>
            </ul>
        </div>
    </nav>

    <div class="container mt-5">
        <h2 class="mb-4">Tipos de Refeição</h2>
        <table class="table">
            <thead>
                <tr>
                    <th scope="col">Nome</th>
                    <th scope="col">Horário Início</th>
                    <th scope="col">Horário Fim</th>
                </tr>
            </thead>
            <tbody>
                {% for tipo in tipos %}
                <tr>
                    <td>{{ tipo.nome }}</td>
                    <td>{{ tipo.horarioInicio }}</td>
                    <td>{{ tipo.horarioFim }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.1/dist/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
